<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Shop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5;color:#172018}
header{background:#168a45;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
.top{max-width:1000px;margin:auto}.brand{font-size:28px;font-weight:800}.sub{opacity:.9;margin-top:4px}
.search{margin-top:14px;width:100%;padding:13px 15px;border:0;border-radius:12px;font-size:16px}
main{max-width:1000px;margin:auto;padding:20px 16px 100px}.hero{background:white;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 3px 15px #00000010}
.hero h1{margin:0 0 8px}.hero p{margin:0;color:#667}
h2{margin:22px 0 12px}.cats{display:flex;gap:10px;overflow:auto;padding-bottom:4px}
.cat{border:0;background:white;border-radius:12px;padding:12px 16px;white-space:nowrap;box-shadow:0 2px 10px #0000000d}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.card{background:white;border-radius:15px;padding:14px;box-shadow:0 3px 12px #0000000d}
.pic{height:95px;background:#eef7f0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px}
.card h3{font-size:16px;margin:10px 0 5px}.price{font-weight:800;font-size:17px}.add{width:100%;margin-top:10px;border:0;background:#168a45;color:white;padding:10px;border-radius:10px;font-weight:700}
.cart{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(92%,480px);background:#172018;color:white;border:0;padding:15px;border-radius:15px;font-size:16px;font-weight:800;box-shadow:0 8px 25px #0004}
.empty{color:#777;text-align:center;padding:25px}
</style>
</head>
<body>
<header><div class="top"><div class="brand">🛒 Grocery Shop</div><div class="sub">Aapki daily grocery, ab aasani se online</div><input id="search" class="search" placeholder="🔎 Product search karein..."></div></header>
<main>
<section class="hero"><h1>Ghar baithe grocery order karein</h1><p>Product select kijiye aur order WhatsApp par bhejiye.</p></section>
<h2>Categories</h2>
<div class="cats">
<button class="cat" onclick="filterCat('all')">All</button><button class="cat" onclick="filterCat('अनाज')">🌾 Anaaj</button>
<button class="cat" onclick="filterCat('दाल')">🥣 Dal</button><button class="cat" onclick="filterCat('बिस्कुट')">🍪 Biscuit</button>
<button class="cat" onclick="filterCat('पेय')">🥤 Drinks</button><button class="cat" onclick="filterCat('मसाला')">🌶️ Masala</button>
</div>
<h2>Products</h2><div id="products" class="products"></div>
</main>
<button class="cart" onclick="order()">🛒 Cart: <span id="count">0</span> item — WhatsApp Order</button>
<script>
const products=[
["चावल","₹60/kg","🌾","अनाज"],["आटा","₹45/kg","🌾","अनाज"],["दाल","₹110/kg","🥣","दाल"],
["बिस्कुट","₹10 से","🍪","बिस्कुट"],["नमक","₹25","🧂","मसाला"],["चीनी","₹50/kg","🍚","अनाज"],
["चाय","₹120","☕","पेय"],["कोल्ड ड्रिंक","₹40","🥤","पेय"],["हल्दी","₹30","🌶️","मसाला"],["तेल","₹140/L","🫗","मसाला"]
];
let cart=[], current="all";
function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let list=products.filter(p=>(current==="all"||p[3]===current)&&p[0].toLowerCase().includes(q));
 document.getElementById("products").innerHTML=list.length?list.map((p,i)=>`<div class="card"><div class="pic">${p[2]}</div><h3>${p[0]}</h3><div class="price">${p[1]}</div><button class="add" onclick="add('${p[0]}','${p[1]}')">+ Add</button></div>`).join(""):'<div class="empty">Product nahi mila.</div>';
}
function filterCat(c){current=c;render()}
function add(name,price){cart.push({name,price});document.getElementById("count").textContent=cart.length}
function order(){
 if(!cart.length){alert("Pehle product cart me add karein.");return}
 let lines=cart.map((x,i)=>`${i+1}. ${x.name} - ${x.price}`).join("\n");
 let msg=`Namaste Grocery Shop!%0A%0AMujhe ye items order karne hain:%0A${encodeURIComponent(lines)}%0A%0AName:%0AAddress:%0APayment: Cash/UPI`;
 window.open("https://wa.me/919852568955?text="+msg,"_blank");
}
document.getElementById("search").addEventListener("input",render);render();
</script>
</body></html>
